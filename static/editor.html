<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>发布 · 张中伟</title>
  <link rel="manifest" href="/manifest-editor.webmanifest">
  <link rel="apple-touch-icon" href="/img/admin/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .editor-wrap { max-width: 620px; margin: 0 auto; padding: 28px 20px 80px; }
    .editor-title { font-size: 1.4rem; margin: 0 0 4px; }
    .editor-note { color: #999; font-size: .85rem; margin: 0 0 22px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: .88rem; color: #555; margin-bottom: 5px; }
    .field input[type="text"], .field input[type="date"], .field select, .field textarea {
      width: 100%; box-sizing: border-box; font: inherit; color: #333;
      border: 1px solid #ddd; background: #fff; padding: 10px 12px; border-radius: 0;
    }
    .field textarea { min-height: 260px; line-height: 1.75; }
    .field input[type="date"] { width: 100%; max-width: 100%; min-width: 0; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #999; }
    .token-box { background: #faf9f6; border: 1px solid #e7e3dc; padding: 14px 16px; margin-bottom: 22px; }
    .btn { font: inherit; border: 1px solid #bbb; background: #fff; padding: 9px 18px; cursor: pointer; }
    .btn-primary { background: #111; color: #fff; border-color: #111; }
    .btn:disabled { opacity: .5; }
    .file-list { font-size: .85rem; color: #666; margin-top: 6px; }
    .status { min-height: 1.4em; margin: 14px 0 6px; font-size: .9rem; color: #333; }
    .status.ok { color: #2e7d32; }
    .status.err { color: #b3261e; }
    .hint { font-size: .8rem; color: #999; }
    .hint, .editor-note { display: none !important; }
    #manageToggle { margin-top: 12px; }
    #managePanel { margin-top: 16px; border-top: 1px solid #eee; padding-top: 14px; }
    #postList li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f2f2f2; font-size: .9rem; }
    #postList a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #postList button { font: inherit; font-size: .8rem; border: 1px solid #ccc; background: #fff; padding: 4px 10px; cursor: pointer; }
    #moduleNav { flex-wrap: nowrap !important; gap: 4px; }
    #homePanel label { display:block; font-size:.85rem; color:#555; margin-bottom:4px; }
    #homePanel input[type="text"] { width:100%; box-sizing:border-box; font:inherit; color:#333; border:1px solid #ddd; padding:9px 12px; }
    #moduleNav button { flex: 1 1 0; min-width: 0; font-size: .88rem; padding: 9px 2px; white-space: nowrap; }
    #fileList { white-space: normal; }
  </style>
</head>
<body>
  <div class="editor-wrap">
    <h1 class="editor-title">落笔</h1>
    <div id="moduleNav" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;">
      <button class="btn btn-primary" type="button" data-module="write">落笔</button>
      <button class="btn" type="button" data-module="home">首页</button>
      <button class="btn" type="button" data-module="logs">日志</button>
      <button class="btn" type="button" data-module="about">关于</button>
    </div>
    <p class="hint" id="moduleHint">选择要管理的栏目：日志、关于页、首页文字、首页照片、分类。</p>

    <div id="homePanel" hidden>
      <div style="margin-bottom:10px;"><label>首页大字</label><input type="text" id="homeHello"></div>
      <div style="margin-bottom:10px;"><label>首页小字</label><input type="text" id="homeTagline"></div>
      <div style="margin-bottom:10px;"><label>页脚文字</label><input type="text" id="homeFooter"></div>
      <button class="btn btn-primary" id="saveHomeBtn" type="button">保存文字</button>
      <hr style="margin:16px 0;border:0;border-top:1px solid #eee;">
      <input type="file" id="photoInput" accept="image/*" multiple>
      <button class="btn" id="photoUpload" type="button" style="margin-top:6px;">上传相片</button>
      <div id="photoGrid" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"></div>
    </div>
    <div class="token-box" id="tokenBox">
      <div class="field">
        <label for="token">GitHub 令牌（只需填一次，只存在这台手机）</label>
        <input type="text" id="token" placeholder="github_pat_… 或 ghp_…" autocomplete="off">
      </div>
    </div>

    <div class="field">
      <label for="title">标题</label>
      <input type="text" id="title" placeholder="给这篇起个名字">
    </div>

    <div class="field">
      <label for="date">日期</label>
      <input type="date" id="date">
    </div>

    <div class="field">
      <label for="category">分类</label>
      <select id="category">
        <option>亲</option>
        <option>生活</option>
        <option>白日梦</option>
        <option>生长</option>
        <option>思考</option>
      </select>
      <input type="text" id="newCategory" placeholder="或输入新分类，例如：朋友、读书" style="margin-top:6px;">
    </div>

    <div class="field">
      <label for="body">正文（空行分段）</label>
      <button type="button" class="btn" id="quoteBtn" style="margin-bottom:6px;font-size:.8rem;">＋ 插入一段引言</button>
      <button type="button" class="btn" id="mediaBtn" style="margin-bottom:6px;font-size:.8rem;">在光标处插入所选图片/视频</button>
      <textarea id="body" placeholder="想写点什么……"></textarea>
    </div>

    <div class="field">
      <label for="files">图片 / 视频（可选，单文件建议小于 20MB）</label>
      <input type="file" id="files" accept="image/*,video/*" multiple>
      <div class="file-list" id="fileList"></div>
    </div>

    <button class="btn btn-primary" id="publish">发布</button>
    <button class="btn" id="cancelEdit" hidden type="button">取消编辑</button>
    <p class="status" id="status"></p>
    <div id="managePanel" hidden>
      <ul id="postList" style="list-style:none;padding:0;margin:0;"></ul>
    </div>
    <p class="status" id="status2"></p>
    <button class="btn" id="tokenBtn" hidden type="button">设置 / 修改令牌</button>
  </div>

  <script src="/js/editor.js" defer></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('/js/sw.js').catch(function () {});
    }
  </script>
</body>
</html>
