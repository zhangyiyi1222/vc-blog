name: 部署到 GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.145.0"
          extended: true

      # 自动判断是用户主页仓库（xxx.github.io）还是项目仓库（xxx.github.io/仓库名）
      - name: 计算站点地址
        id: baseurl
        run: |
          echo "url=https://zhangzhongwei.top/" >> "$GITHUB_OUTPUT"

      - name: 构建站点
        run: hugo --minify --baseURL "${{ steps.baseurl.outputs.url }}"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
