{{- /* 翻页控件：接收一个分页器 */ -}}
{{- if gt .TotalPages 1 -}}
<nav class="pager" aria-label="分页">
  {{- if .HasPrev -}}
  <a class="pager-link" href="{{ .Prev.URL }}">上一页</a>
  {{- else -}}
  <span class="pager-link pager-off">上一页</span>
  {{- end -}}
  <span class="pager-info">{{ .PageNumber }} / {{ .TotalPages }}</span>
  {{- if .HasNext -}}
  <a class="pager-link" href="{{ .Next.URL }}">下一页</a>
  {{- else -}}
  <span class="pager-link pager-off">下一页</span>
  {{- end -}}
</nav>
{{- end -}}
